<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GauraPrompter - Professional Online Teleprompter</title>
    <!-- Google Fonts for online rendering; fallback chains are defined in CSS for offline compatibility -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Setup Screen (Dashboard) -->
    <main id="setup-screen" class="screen">
        <header class="setup-header">
            <div class="logo-container">
                <span class="logo-icon">✦</span>
                <h1 class="logo-text">Gaura<span class="highlight">Prompter</span></h1>
            </div>
            <p class="subtitle">A clean, responsive teleprompter designed for presenters and creators.</p>
        </header>

        <section class="setup-container">
            <div class="script-section">
                <label for="script-input" class="section-label">Your Script</label>
                <textarea id="script-input" placeholder="Paste your script or write here..." aria-label="Script Input">Welcome to GauraPrompter. This is a modern, responsive, and offline-capable teleprompter designed for presenters, content creators, and public speakers.

You can customize the text size, scrolling speed, alignment, and display colors to suit your configuration. 

Use the Control Bar at the top of the playback screen to manage your presentation. Alternatively, you can use the keyboard shortcuts for hands-free control:

- Press Spacebar to Play or Pause the scroll.
- Press Arrow Up to increase the speed.
- Press Arrow Down to decrease the speed.
- Press F to mirror-flip the text for physical beam-splitter teleprompter glass.
- Press Escape to instantly exit the playback and return to this setup screen.

To begin testing your setup, adjust your options below and click the prominent blue "START PROMPTER" button below.</textarea>
            </div>

            <div class="settings-section">
                <h2 class="section-label">Configuration Settings</h2>
                <div class="settings-grid">
                    <!-- Font Size Control -->
                    <div class="control-group">
                        <label for="font-size">Font Size</label>
                        <select id="font-size">
                            <option value="size-sm">Small</option>
                            <option value="size-md" selected>Medium</option>
                            <option value="size-lg">Large</option>
                            <option value="size-xl">Extra Large</option>
                            <option value="size-max">Massive</option>
                        </select>
                    </div>

                    <!-- Text Alignment -->
                    <div class="control-group">
                        <label for="text-align">Text Alignment</label>
                        <select id="text-align">
                            <option value="left">Left</option>
                            <option value="center" selected>Center</option>
                            <option value="right">Right</option>
                        </select>
                    </div>

                    <!-- Text Color Picker -->
                    <div class="control-group">
                        <label for="text-color">Text Color</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="text-color" value="#ffffff">
                            <span id="text-color-hex" class="hex-preview">#FFFFFF</span>
                        </div>
                    </div>

                    <!-- Background Color Picker -->
                    <div class="control-group">
                        <label for="bg-color">Background Color</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="bg-color" value="#000000">
                            <span id="bg-color-hex" class="hex-preview">#000000</span>
                        </div>
                    </div>
                </div>

                <button id="start-btn" class="primary-btn">
                    <span>START PROMPTER</span>
                    <span class="btn-arrow">→</span>
                </button>
            </div>
        </section>
        
        <footer class="app-footer">
            <p>Offline Ready. All configurations are saved locally in your web browser.</p>
        </footer>
    </main>

    <!-- Prompter Playback Screen -->
    <div id="prompter-screen" class="screen hidden">
        <!-- Floating Control Bar -->
        <nav class="control-bar" aria-label="Playback controls">
            <div class="control-group-left">
                <button id="exit-btn" class="control-btn danger-btn" title="Exit to Setup (Esc)">Exit</button>
            </div>
            
            <div class="control-group-center">
                <button id="slow-btn" class="control-btn" title="Slower (Arrow Down)">Slower</button>
                <button id="play-btn" class="control-btn action-btn" title="Play/Pause (Space)">Play</button>
                <div class="speed-display">
                    <span class="speed-label">SPEED</span>
                    <span id="speed-val" class="speed-number">5</span>
                </div>
                <button id="fast-btn" class="control-btn" title="Faster (Arrow Up)">Faster</button>
            </div>

            <div class="control-group-right">
                <button id="flip-btn" class="control-btn" title="Flip text horizontally (F)">Mirror Flip</button>
                <button id="reset-btn" class="control-btn" title="Reset positions">Reset</button>
            </div>
        </nav>

        <!-- Cue Marker Overlay -->
        <div class="cue-container">
            <div class="cue-marker cue-left"></div>
            <div class="cue-line"></div>
            <div class="cue-marker cue-right"></div>
        </div>

        <!-- Prompter Scroll Container -->
        <main id="prompter-scroll-container">
            <div id="prompter-text-output"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
